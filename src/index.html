<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Semantic Machines — платформа Veda для создания корпоративных приложений">
  <title>Смысловые машины</title>
  <link rel="icon" type="image/svg+xml" href="css/img/favicon.svg">
  <style>
    :root {
      --color-bg: #ffffff;
      --color-bg-alt: #f5f7fa;
      --color-border: #e2e8f0;
      --radius-sm: 4px;
      --radius-md: 8px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.07);
      --container-max: 1140px;
      --container-pad: 24px;
      --section-pad: 40px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--color-bg); }
    .container {
      max-width: var(--container-max);
      margin-inline: auto;
      padding-inline: max(var(--container-pad), env(safe-area-inset-left, 0px))
        max(var(--container-pad), env(safe-area-inset-right, 0px));
    }
    site-app:not([data-ready]) { visibility: hidden; }
    .app-skeleton {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--color-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: auto;
      transition: opacity 0.15s ease;
    }
    .app-skeleton--out { opacity: 0; pointer-events: none; }
    .app-skeleton__nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #fff;
      border-bottom: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
    }
    .app-skeleton__nav-inner {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding-block: 0.6rem;
    }
    .app-skeleton__logo { width: 160px; height: 28px; border-radius: var(--radius-sm); }
    .app-skeleton__nav-links { flex: 1; display: flex; gap: 1.5rem; }
    .app-skeleton__nav-link { width: 72px; height: 16px; border-radius: var(--radius-sm); }
    .app-skeleton__lang { display: flex; gap: 0.25rem; }
    .app-skeleton__lang-btn { width: 32px; height: 28px; border-radius: var(--radius-sm); }
    .app-skeleton__main { flex: 1; padding-block: var(--section-pad); }
    .app-skeleton__hero { max-width: 640px; margin-bottom: 3rem; }
    .app-skeleton__line {
      height: 1em;
      border-radius: var(--radius-sm);
      margin-bottom: 0.75rem;
    }
    .app-skeleton__line--title {
      height: 2.25rem;
      width: 70%;
      margin-bottom: 1.25rem;
    }
    .app-skeleton__line--short { width: 55%; }
    .app-skeleton__cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .app-skeleton__card { height: 140px; border-radius: var(--radius-md); }
    .sk-shimmer,
    .app-skeleton__logo,
    .app-skeleton__nav-link,
    .app-skeleton__lang-btn,
    .app-skeleton__line,
    .app-skeleton__card {
      background: linear-gradient(
        90deg,
        var(--color-bg-alt) 0%,
        #eef1f6 40%,
        var(--color-bg-alt) 80%
      );
      background-size: 200% 100%;
      animation: sk-shimmer 1.4s ease-in-out infinite;
    }
    @keyframes sk-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
  <!-- Preload app CSS without blocking first paint (stylesheets are after #app-skeleton). -->
  <link rel="preload" href="css/main.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" href="css/layout.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" href="css/outlet.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" href="css/skeleton.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
</head>
<body>
  <div id="app-skeleton" class="app-skeleton" aria-hidden="true">
    <header class="app-skeleton__nav">
      <div class="container app-skeleton__nav-inner">
        <div class="app-skeleton__logo sk-shimmer"></div>
        <div class="app-skeleton__nav-links">
          <div class="app-skeleton__nav-link sk-shimmer"></div>
          <div class="app-skeleton__nav-link sk-shimmer"></div>
          <div class="app-skeleton__nav-link sk-shimmer"></div>
          <div class="app-skeleton__nav-link sk-shimmer"></div>
        </div>
        <div class="app-skeleton__lang">
          <div class="app-skeleton__lang-btn sk-shimmer"></div>
          <div class="app-skeleton__lang-btn sk-shimmer"></div>
        </div>
      </div>
    </header>
    <main class="app-skeleton__main">
      <div class="container">
        <div class="app-skeleton__hero">
          <div class="app-skeleton__line app-skeleton__line--title sk-shimmer"></div>
          <div class="app-skeleton__line sk-shimmer"></div>
          <div class="app-skeleton__line sk-shimmer"></div>
          <div class="app-skeleton__line app-skeleton__line--short sk-shimmer"></div>
        </div>
        <div class="app-skeleton__cards">
          <div class="app-skeleton__card sk-shimmer"></div>
          <div class="app-skeleton__card sk-shimmer"></div>
          <div class="app-skeleton__card sk-shimmer"></div>
        </div>
      </div>
    </main>
  </div>
  <site-app></site-app>
  <script type="module" src="index.js" defer></script>
</body>
</html>

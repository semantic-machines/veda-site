<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Semantic Machines — платформа Veda для создания корпоративных приложений">
  <title>Смысловые машины</title>
  <link rel="icon" type="image/svg+xml" href="css/img/favicon.svg">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/outlet.css">
  <link rel="stylesheet" href="css/skeleton.css">
</head>
<body>
  <div id="app-skeleton" class="app-skeleton" aria-hidden="true">
    <header class="app-skeleton__nav">
      <div class="container app-skeleton__nav-inner">
        <div class="app-skeleton__logo sk-shimmer"></div>
        <div class="app-skeleton__nav-links">
          <div class="app-skeleton__nav-link sk-shimmer"></div>
          <div class="app-skeleton__nav-link sk-shimmer"></div>
          <div class="app-skeleton__nav-link sk-shimmer"></div>
          <div class="app-skeleton__nav-link sk-shimmer"></div>
        </div>
        <div class="app-skeleton__lang">
          <div class="app-skeleton__lang-btn sk-shimmer"></div>
          <div class="app-skeleton__lang-btn sk-shimmer"></div>
        </div>
      </div>
    </header>
    <main class="app-skeleton__main">
      <div class="container">
        <div class="app-skeleton__hero">
          <div class="app-skeleton__line app-skeleton__line--title sk-shimmer"></div>
          <div class="app-skeleton__line sk-shimmer"></div>
          <div class="app-skeleton__line sk-shimmer"></div>
          <div class="app-skeleton__line app-skeleton__line--short sk-shimmer"></div>
        </div>
        <div class="app-skeleton__cards">
          <div class="app-skeleton__card sk-shimmer"></div>
          <div class="app-skeleton__card sk-shimmer"></div>
          <div class="app-skeleton__card sk-shimmer"></div>
        </div>
      </div>
    </main>
  </div>
  <site-app></site-app>
  <script type="module" src="index.js"></script>
</body>
</html>
